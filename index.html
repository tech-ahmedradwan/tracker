<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Backend Mastery Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4ef;
    --card-bg: #ffffff;
    --text-main: #1c1b1a;
    --text-muted: #706c63;
    --primary: #2f5233;
    --primary-light: #dbe6d5;
    --accent: #c1502e;
    --accent-light: #f5ded4;
    --success: #2f5233;
    --success-light: #dbe6d5;
    --danger: #b3432b;
    --danger-light: #f5ded4;
    --pending: #9c9689;
    --pending-light: #eceae3;
    --border: #e2ded3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card-bg: #1f2124;
      --text-main: #f2f0ea;
      --text-muted: #a29d92;
      --border: #33322f;
      --primary-light: #2a3a2c;
      --success-light: #2a3a2c;
      --danger-light: #402521;
      --accent-light: #402521;
      --pending-light: #2a2926;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    padding: 2rem 1rem 4rem;
    line-height: 1.5;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem; font-weight: 700; letter-spacing: -0.02em;
  }
  .header .meta { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem; }

  .tabs {
    display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tab-btn {
    font-family: 'Space Grotesk', sans-serif;
    background: none; border: none; cursor: pointer;
    padding: 0.75rem 1rem; font-size: 0.95rem; font-weight: 600;
    color: var(--text-muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px; white-space: nowrap; flex-shrink: 0;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--card-bg); border-radius: 14px; padding: 1.25rem 1.5rem;
    border: 1px solid var(--border); margin-bottom: 1.5rem;
  }

  .range-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; flex: 1 1 140px; min-width: 140px; }
  .field label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
  input[type="date"], input[type="text"] {
    font-family: inherit; padding: 0.5rem 0.65rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-main);
    font-size: 16px; width: 100%;
  }
  button.primary {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    background: var(--primary); color: #fff; border: none;
    padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    white-space: nowrap;
  }
  button.ghost {
    font-family: inherit; background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); padding: 0.5rem 0.8rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }

  .progress-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.6rem; font-size: 0.9rem; gap: 0.5rem; flex-wrap: wrap; }
  .progress-wrap { height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.4s; }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem; font-weight: 700; margin: 1.75rem 0 0.9rem;
  }

  .today-card {
    background: linear-gradient(to right bottom, var(--primary-light), var(--card-bg));
    border: 2px solid var(--primary); border-radius: 14px; padding: 1.5rem;
  }

  .add-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  .add-row input[type="text"] { flex: 1 1 160px; }
  .add-row button { flex-shrink: 0; }

  .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }
  .day-card {
    background: var(--card-bg); border-radius: 12px; padding: 1.1rem;
    border: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .day-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 0.75rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--border);
    gap: 0.5rem;
  }
  .day-title { font-weight: 600; font-family: 'Space Grotesk', sans-serif; }
  .day-title small { opacity: 0.55; font-weight: 400; margin-left: 0.4rem; }

  .badge {
    padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.7rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  }
  .badge.achieved { background: var(--success-light); color: var(--success); }
  .badge.missed { background: var(--danger-light); color: var(--danger); }
  .badge.pending { background: var(--pending-light); color: var(--pending); }
  .badge.today { background: var(--primary); color: white; }
  .badge.empty { background: var(--pending-light); color: var(--pending); }

  .task-list { display: flex; flex-direction: column; gap: 0.55rem; flex-grow: 1; }
  .task { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.9rem; }
  .task input[type="checkbox"] {
    appearance: none; margin: 0.15rem 0 0 0; width: 1.2em; height: 1.2em;
    border: 2px solid var(--text-muted); border-radius: 0.25em; display: grid;
    place-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s; background: var(--card-bg);
  }
  .task input[type="checkbox"]::before {
    content: ""; width: 0.62em; height: 0.62em;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    transform: scale(0); transform-origin: bottom left; transition: 120ms transform ease-in-out;
    background-color: white;
  }
  .task input[type="checkbox"]:checked { background-color: var(--success); border-color: var(--success); }
  .task input[type="checkbox"]:checked::before { transform: scale(1); }
  .task span.completed { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }
  .task .del { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 0.2rem 0.4rem; flex-shrink: 0; }
  .task-readonly { align-items: center; }
  .status-dot {
    width: 0.7em; height: 0.7em; border-radius: 50%; flex-shrink: 0;
    background: var(--pending); opacity: 0.5;
  }
  .status-dot.done { background: var(--success); opacity: 1; }
  .empty-state { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }

  .topic-group { margin-bottom: 1.25rem; }
  .topic-group h3 {
    font-family: 'Space Grotesk', sans-serif; font-size: 1rem; margin-bottom: 0.6rem;
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
  }
  .topic-group h3 .count { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .topic-item {
    display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.15rem;
    border-bottom: 1px solid var(--border); font-size: 0.9rem;
  }
  .topic-item input[type="checkbox"] {
    appearance: none; width: 1.2em; height: 1.2em; border: 2px solid var(--text-muted);
    border-radius: 50%; display: grid; place-content: center; cursor: pointer; flex-shrink: 0;
    background: var(--card-bg);
  }
  .topic-item input[type="checkbox"]::before {
    content: ""; width: 0.55em; height: 0.55em; border-radius: 50%;
    transform: scale(0); transition: 120ms transform ease-in-out; background-color: white;
  }
  .topic-item input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
  .topic-item input[type="checkbox"]:checked::before { transform: scale(1); }
  .topic-item span.done { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }

  button.reset-btn {
    display: block; margin-top: 1.5rem; padding: 0.6rem 1rem; border: 1px solid var(--danger);
    border-radius: 8px; background: transparent; color: var(--danger); font-weight: 600;
    cursor: pointer; font-size: 0.85rem; width: 100%; max-width: 260px;
  }
  .loading { color: var(--text-muted); font-size: 0.85rem; }
  .storage-warning {
    background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent);
    border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1.5rem;
  }

  /* ---- Mobile responsiveness ---- */
  @media (max-width: 640px) {
    body { padding: 1.25rem 0.75rem 3rem; }
    .header h1 { font-size: 1.5rem; }
    .card { padding: 1rem; border-radius: 12px; }
    .days-grid { grid-template-columns: 1fr; }
    .range-row { flex-direction: column; align-items: stretch; }
    .range-row .field { min-width: 0; }
    .range-row button.primary { width: 100%; }
    .day-header { flex-wrap: wrap; }
    .tab-btn { padding: 0.65rem 0.75rem; font-size: 0.88rem; }
    .section-title { font-size: 1.05rem; }
    button.reset-btn { max-width: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Backend Mastery Tracker</h1>
    <div class="meta" id="rangeMeta">Loading your plan…</div>
  </div>

  <div id="storageWarning"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="quick">Today &amp; Tomorrow</button>
    <button class="tab-btn" data-tab="daily">Daily Tracker</button>
    <button class="tab-btn" data-tab="topics">Topics Checklist</button>
  </div>

  <!-- QUICK TAB: today + tomorrow only -->
  <div class="tab-panel active" id="tab-quick">
    <h2 class="section-title" style="margin-top:0">Today &amp; Tomorrow</h2>
    <div class="days-grid" id="quick-container"><div class="loading">Loading…</div></div>
  </div>

  <!-- DAILY TAB -->
  <div class="tab-panel" id="tab-daily">

    <div class="card">
      <div class="range-row">
        <div class="field">
          <label for="startDate">Start date</label>
          <input type="date" id="startDate">
        </div>
        <div class="field">
          <label for="endDate">End date</label>
          <input type="date" id="endDate">
        </div>
        <button class="primary" id="applyRangeBtn">Apply range</button>
      </div>
    </div>

    <div class="card">
      <div class="progress-header">
        <span>Journey Progress</span>
        <span id="progressText">0 / 0 days</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <p class="meta" style="margin-bottom: 0.5rem;">To-dos are added from the "Today &amp; Tomorrow" tab. This view just shows what was planned each day and whether it was achieved.</p>

    <h2 class="section-title">Today</h2>
    <div id="today-container"><div class="loading">Loading…</div></div>

    <h2 class="section-title">All Days</h2>
    <div class="days-grid" id="all-days-container"><div class="loading">Loading…</div></div>

    <button class="reset-btn" id="resetDailyBtn">Reset all daily to-dos</button>
  </div>

  <!-- TOPICS TAB -->
  <div class="tab-panel" id="tab-topics">
    <div class="card">
      <div class="progress-header">
        <span>Topics Mastered</span>
        <span id="topicsProgressText">0 / 0</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="topicsProgressBar"></div></div>
    </div>
    <div id="topics-container"><div class="loading">Loading…</div></div>
    <button class="reset-btn" id="resetTopicsBtn">Reset topics checklist</button>
  </div>
</div>

<script>
// ---------- Storage layer ----------
// The original version of this tracker used `window.storage`, an API that only
// exists inside Claude.ai artifacts. On a plain static host like GitHub Pages
// that object doesn't exist, every storage call throws, and the page never
// gets past "Loading…". This wrapper uses localStorage instead, which works
// on any static host (data is saved per-browser, on that device).
const storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      console.error('Storage error:', e);
      return null;
    }
  }
};

// Warn the user (once) if localStorage isn't available at all (e.g. private
// browsing in some browsers, or storage disabled) so data-loss isn't silent.
(function checkStorageAvailable() {
  try {
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
  } catch (e) {
    document.getElementById('storageWarning').innerHTML =
      '<div class="storage-warning">Your browser is blocking local storage (private/incognito mode or storage disabled), so progress won\'t be saved between visits.</div>';
  }
})();

// ---------- Topic catalog ----------
const topicCatalog = [
  { group: "Java Basics", items: [
    "Data types, variables, and operators",
    "Control flow (if-else, loops, switch)",
    "OOP: Inheritance, Polymorphism, Encapsulation, Abstraction",
    "Classes, Objects, Interfaces, Abstract Classes",
    "Method overloading and overriding",
    "Static and final keywords"
  ]},
  { group: "Java Collections Framework", items: [
    "List, Set, Map, Queue implementations",
    "Internal working of HashMap, ConcurrentHashMap, Hashtable",
    "Iterators and Comparators",
    "Fail-fast vs. Fail-safe iterators"
  ]},
  { group: "Exception Handling", items: [
    "Checked vs. Unchecked exceptions",
    "Custom exceptions",
    "Try-with-resources"
  ]},
  { group: "Multithreading and Concurrency", items: [
    "Thread life cycle and states",
    "Creating threads (extends Thread vs. implements Runnable)",
    "Synchronization, volatile, and atomic variables",
    "Thread pools and ExecutorService",
    "Concurrent collections (ConcurrentHashMap, BlockingQueue)",
    "Deadlock, livelock, and race conditions",
    "CompletableFuture and async programming"
  ]},
  { group: "Java Memory Management", items: [
    "JVM architecture (Heap, Stack, Method Area)",
    "Garbage Collection algorithms and tuning",
    "Memory leaks and how to avoid them"
  ]},
  { group: "Java 8+ Features", items: [
    "Lambda expressions",
    "Streams API",
    "Functional interfaces (Predicate, Consumer, Supplier)",
    "Optional class",
    "Date and Time API (java.time)",
    "Default and static methods in interfaces"
  ]},
  { group: "Spring Framework", items: [
    "Spring Core: DI and IoC",
    "Spring Boot: auto-config, starters, properties",
    "Spring MVC: request flow, controllers, REST APIs",
    "Spring Data JPA: repositories, entity mapping, query methods",
    "Spring Security: authN, authZ, OAuth2",
    "Spring AOP"
  ]},
  { group: "RESTful Web Services", items: [
    "REST principles (statelessness, HTTP methods, status codes)",
    "Designing REST APIs (naming, versioning, pagination)",
    "Error handling and validation",
    "HATEOAS"
  ]},
  { group: "Microservices Architecture", items: [
    "Monolithic vs. Microservices",
    "Service discovery (Eureka, Consul)",
    "API Gateway (Spring Cloud Gateway, Zuul)",
    "Communication (REST, gRPC, messaging queues)",
    "Circuit Breaker (Resilience4j, Hystrix)",
    "Distributed tracing and logging (Sleuth, Zipkin)"
  ]},
  { group: "Database and ORM", items: [
    "SQL vs. NoSQL databases",
    "JDBC and connection pooling (HikariCP)",
    "Hibernate and JPA (EntityManager, caching, lazy loading)",
    "Transactions and isolation levels",
    "Database indexing and optimization"
  ]},
  { group: "Caching", items: [
    "In-memory caching (Ehcache, Caffeine)",
    "Distributed caching (Redis, Memcached)",
    "Cache eviction policies and strategies"
  ]},
  { group: "System Design Principles", items: [
    "SOLID principles",
    "Design patterns (Singleton, Factory, Builder, Observer, Strategy...)"
  ]},
  { group: "Scalability and Performance", items: [
    "Horizontal vs. Vertical scaling",
    "Load balancing"
  ]},
  { group: "API Design", items: [
    "REST vs. GraphQL vs. SOAP",
    "API versioning and backward compatibility",
    "Rate limiting and throttling"
  ]},
  { group: "Cloud and DevOps", items: [
    "Cloud platforms (AWS, Azure, GCP)",
    "Containerization (Docker, Kubernetes)",
    "CI/CD pipelines (Jenkins, GitLab CI, GitHub Actions)"
  ]},
  { group: "Testing", items: [
    "Unit Testing: JUnit, Mockito",
    "Integration Testing: Spring Boot Test, H2",
    "Performance Testing: JMeter, Gatling, load/stress testing"
  ]},
  { group: "Tools and Technologies", items: [
    "Build Tools: Maven and Gradle",
    "Version Control: Git (branching, merging, rebasing)",
    "Monitoring and Logging (Log4j, SLF4J, Prometheus, Grafana, ELK)",
    "Code Quality (SonarQube, Checkstyle, PMD)"
  ]},
  { group: "Behavioral and Soft Skills", items: [
    "Problem-Solving (LeetCode/HackerRank/Codeforces, DSA)",
    "Communication (explaining thought process, past projects)",
    "Leadership (mentoring, handling conflicts)"
  ]}
];

// ---------- Storage keys ----------
const K_RANGE = "tracker:range";
const K_TODOS = "tracker:todos"; // { "2026-08-20": [{text, done}], ... }
const K_TOPICS = "tracker:topics"; // { "group|index": true }

let range = { start: null, end: null };
let todos = {};
let topicState = {};

// All date math below works on local calendar dates only (no UTC conversion),
// which avoids the timezone shift that caused every day to compare equal to "today".
function toLocalStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayStr() {
  return toLocalStr(new Date());
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return toLocalStr(dt);
}
function fmt(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function loadAll() {
  try {
    const r = await storage.get(K_RANGE);
    range = r ? JSON.parse(r.value) : null;
  } catch (e) { range = null; }
  try {
    const t = await storage.get(K_TODOS);
    todos = t ? JSON.parse(t.value) : {};
  } catch (e) { todos = {}; }
  try {
    const tp = await storage.get(K_TOPICS);
    topicState = tp ? JSON.parse(tp.value) : {};
  } catch (e) { topicState = {}; }

  if (!range) {
    const s = todayStr();
    range = { start: s, end: addDays(s, 19) };
    await saveRange();
  }
  document.getElementById('startDate').value = range.start;
  document.getElementById('endDate').value = range.end;
}

async function saveRange() {
  await storage.set(K_RANGE, JSON.stringify(range));
}
async function saveTodos() {
  await storage.set(K_TODOS, JSON.stringify(todos));
}
async function saveTopics() {
  await storage.set(K_TOPICS, JSON.stringify(topicState));
}

function getDatesInRange() {
  const dates = [];
  let cur = range.start;
  let guard = 0;
  while (cur <= range.end && guard < 400) {
    dates.push(cur);
    cur = addDays(cur, 1);
    guard++;
  }
  return dates;
}

function dayStatus(dateStr) {
  const list = todos[dateStr] || [];
  const t = todayStr();
  if (list.length === 0) {
    if (dateStr === t) return { cls: 'today', text: 'Today' };
    if (dateStr < t) return { cls: 'empty', text: 'No tasks' };
    return { cls: 'pending', text: 'Pending' };
  }
  const allDone = list.every(x => x.done);
  if (allDone) return { cls: 'achieved', text: 'Achieved' };
  if (dateStr === t) return { cls: 'today', text: 'Today' };
  if (dateStr < t) return { cls: 'missed', text: 'Missed' };
  return { cls: 'pending', text: 'Pending' };
}

function taskListHTML(dateStr, readOnly) {
  const list = todos[dateStr] || [];
  if (list.length === 0) {
    return `<div class="empty-state">${readOnly ? 'No to-dos set for this day.' : 'No to-dos yet. Add what you want to achieve.'}</div>`;
  }
  if (readOnly) {
    return list.map((task) => `
      <div class="task task-readonly">
        <span class="status-dot ${task.done ? 'done' : ''}"></span>
        <span class="${task.done ? 'completed' : ''}">${escapeHTML(task.text)}</span>
      </div>
    `).join('');
  }
  return list.map((task, idx) => `
    <label class="task">
      <input type="checkbox" ${task.done ? 'checked' : ''} data-date="${dateStr}" data-idx="${idx}" class="task-check">
      <span class="${task.done ? 'completed' : ''}">${escapeHTML(task.text)}</span>
      <button class="del" data-date="${dateStr}" data-idx="${idx}" title="Remove">✕</button>
    </label>
  `).join('');
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function dayCardHTML(dateStr, label, isToday, showAdd, readOnly) {
  const status = dayStatus(dateStr);
  const addRow = showAdd ? `
      <div class="add-row">
        <input type="text" placeholder="Add a to-do…" class="new-task-input" data-date="${dateStr}">
        <button class="primary add-task-btn" data-date="${dateStr}">Add</button>
      </div>` : '';
  return `
    <div class="${isToday ? 'today-card' : 'day-card'}" data-date="${dateStr}">
      <div class="day-header">
        <div class="day-title">${label}<small>${fmt(dateStr)}</small></div>
        <span class="badge ${status.cls}">${status.text}</span>
      </div>
      <div class="task-list">${taskListHTML(dateStr, readOnly)}</div>
      ${addRow}
    </div>
  `;
}

// Renders day cards into any container and wires up their controls.
// scoping handlers to the container avoids cross-tab duplicate bindings.
// `editable` controls whether to-dos can be added/checked/removed here at all
// (true only in the Today & Tomorrow tab); the Daily Tracker tab renders
// read-only cards that just display each day's to-dos and achieved status.
function renderInto(container, dates, labels, onChange, editable) {
  const t = todayStr();
  container.innerHTML = dates.map((d, i) => dayCardHTML(d, labels[i], d === t, editable, !editable)).join('');

  if (!editable) return;

  container.querySelectorAll('.task-check').forEach(el => {
    el.addEventListener('change', async (e) => {
      const date = e.target.dataset.date;
      const idx = parseInt(e.target.dataset.idx, 10);
      todos[date][idx].done = e.target.checked;
      await saveTodos();
      onChange();
    });
  });
  container.querySelectorAll('.del').forEach(el => {
    el.addEventListener('click', async (e) => {
      const date = e.target.dataset.date;
      const idx = parseInt(e.target.dataset.idx, 10);
      todos[date].splice(idx, 1);
      await saveTodos();
      onChange();
    });
  });
  container.querySelectorAll('.add-task-btn').forEach(el => {
    el.addEventListener('click', async (e) => {
      const date = e.target.dataset.date;
      const input = container.querySelector(`.new-task-input[data-date="${date}"]`);
      const val = input.value.trim();
      if (!val) return;
      if (!todos[date]) todos[date] = [];
      todos[date].push({ text: val, done: false });
      await saveTodos();
      onChange();
    });
  });
  container.querySelectorAll('.new-task-input').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        container.querySelector(`.add-task-btn[data-date="${e.target.dataset.date}"]`).click();
      }
    });
  });
}

function renderDaily() {
  const dates = getDatesInRange();
  const t = todayStr();
  document.getElementById('rangeMeta').textContent =
    `${fmt(range.start)} — ${fmt(range.end)} • ${dates.length} day${dates.length !== 1 ? 's' : ''}`;

  const todayContainer = document.getElementById('today-container');
  if (dates.includes(t)) {
    const idx = dates.indexOf(t) + 1;
    renderInto(todayContainer, [t], [`Day ${idx}`], renderDaily, false);
  } else {
    todayContainer.innerHTML = `<div class="empty-state">Today is outside your selected date range.</div>`;
  }

  const allContainer = document.getElementById('all-days-container');
  renderInto(allContainer, dates, dates.map((d, i) => `Day ${i+1}`), renderDaily, false);

  const achievedCount = dates.filter(d => {
    const list = todos[d] || [];
    return list.length > 0 && list.every(x => x.done);
  }).length;
  const pct = dates.length ? Math.round((achievedCount / dates.length) * 100) : 0;
  document.getElementById('progressText').textContent = `${achievedCount} / ${dates.length} days`;
  document.getElementById('progressBar').style.width = pct + '%';
}

function renderQuick() {
  const t = todayStr();
  const tmr = addDays(t, 1);
  const container = document.getElementById('quick-container');
  renderInto(container, [t, tmr], ['Today', 'Tomorrow'], renderQuick, true);
}

function renderTopics() {
  const container = document.getElementById('topics-container');
  let total = 0, done = 0;
  container.innerHTML = topicCatalog.map(group => {
    let groupDone = 0;
    const itemsHTML = group.items.map((item, idx) => {
      const key = `${group.group}|${idx}`;
      const checked = !!topicState[key];
      total++; if (checked) { done++; groupDone++; }
      return `
        <label class="topic-item">
          <input type="checkbox" class="topic-check" data-key="${key}" ${checked ? 'checked' : ''}>
          <span class="${checked ? 'done' : ''}">${escapeHTML(item)}</span>
        </label>
      `;
    }).join('');
    return `
      <div class="topic-group">
        <h3>${group.group} <span class="count">${groupDone}/${group.items.length}</span></h3>
        ${itemsHTML}
      </div>
    `;
  }).join('');

  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('topicsProgressText').textContent = `${done} / ${total}`;
  document.getElementById('topicsProgressBar').style.width = pct + '%';

  document.querySelectorAll('.topic-check').forEach(el => {
    el.addEventListener('change', async (e) => {
      topicState[e.target.dataset.key] = e.target.checked;
      await saveTopics();
      renderTopics();
    });
  });
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------- Range control ----------
document.getElementById('applyRangeBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  const s = document.getElementById('startDate').value;
  const en = document.getElementById('endDate').value;
  if (!s || !en) { alert('Please choose both a start and end date.'); return; }
  if (s > en) { alert('Start date must be before end date.'); return; }
  const span = (new Date(en) - new Date(s)) / 86400000;
  if (span > 365) { alert('Please choose a range of 365 days or fewer.'); return; }
  range = { start: s, end: en };
  await saveRange();
  renderDaily();
});

// ---------- Resets ----------
document.getElementById('resetDailyBtn').addEventListener('click', async () => {
  if (!confirm('Clear all daily to-dos? This cannot be undone.')) return;
  todos = {};
  await saveTodos();
  renderDaily();
  renderQuick();
});
document.getElementById('resetTopicsBtn').addEventListener('click', async () => {
  if (!confirm('Reset the topics checklist? This cannot be undone.')) return;
  topicState = {};
  await saveTopics();
  renderTopics();
});

// ---------- Init ----------
(async function init() {
  await loadAll();
  renderQuick();
  renderDaily();
  renderTopics();
})();
</script>
</body>
</html>
