<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20-Day Backend Study Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-light: #e0e7ff;
    --success: #10b981;
    --success-light: #d1fae5;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --pending: #9ca3af;
    --pending-light: #f3f4f6;
    --border: #e5e7eb;
    
    color-scheme: light dark; 
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --primary-light: #3730a3;
      --success-light: #065f46;
      --danger-light: #7f1d1d;
      --pending-light: #374151;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    padding: 2rem 1rem;
    line-height: 1.5;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
  }

  /* Header & Summary */
  .header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }
  .header .meta {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 500;
  }

  /* Progress Section */
  .progress-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    margin-bottom: 2rem;
    border: 1px solid var(--border);
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-weight: 600;
  }
  .progress-wrap {
    height: 12px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), #818cf8);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--text-muted);
    justify-content: space-between;
  }
  .totals div strong { color: var(--text-main); }

  /* Section Titles */
  .section-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Today's Card */
  .today-section {
    margin-bottom: 3rem;
  }
  .today-card {
    background: linear-gradient(to right bottom, var(--primary-light), var(--card-bg));
    border: 2px solid var(--primary);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }
  
  /* Grid for All Days */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  
  /* Day Card */
  .day-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 1.25rem;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
  }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .day-title {
    font-weight: 600;
    font-size: 1.1rem;
  }
  
  /* Status Badges */
  .badge {
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.achieved { background: var(--success-light); color: var(--success); }
  .badge.missed { background: var(--danger-light); color: var(--danger); }
  .badge.pending { background: var(--pending-light); color: var(--pending); }
  .badge.today { background: var(--primary); color: white; }

  /* Tasks */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    flex-grow: 1;
  }
  .task {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .task input[type="checkbox"] {
    appearance: none;
    background-color: var(--card-bg);
    margin: 0.15rem 0 0 0;
    font: inherit;
    color: currentColor;
    width: 1.15em;
    height: 1.15em;
    border: 2px solid var(--text-muted);
    border-radius: 0.25em;
    display: grid;
    place-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .task input[type="checkbox"]::before {
    content: "";
    width: 0.65em;
    height: 0.65em;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    transform: scale(0);
    transform-origin: bottom left;
    transition: 120ms transform ease-in-out;
    background-color: white;
  }
  .task input[type="checkbox"]:checked {
    background-color: var(--success);
    border-color: var(--success);
  }
  .task input[type="checkbox"]:checked::before {
    transform: scale(1);
  }
  .task span {
    transition: color 0.2s, text-decoration 0.2s;
  }
  .task span.completed {
    text-decoration: line-through;
    color: var(--text-muted);
    opacity: 0.7;
  }

  button.reset-btn {
    display: block;
    width: 100%;
    margin-top: 2rem;
    padding: 0.75rem;
    border: 1px solid var(--danger);
    border-radius: 8px;
    background: transparent;
    color: var(--danger);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button.reset-btn:hover {
    background: var(--danger);
    color: white;
  }
  
  .empty-state {
    color: var(--text-muted);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🚀 Backend Mastery Tracker</h1>
    <div class="meta">Aug 10, 2026 — Aug 29, 2026 • 3H Daily • 60H Total</div>
  </div>

  <div class="progress-card">
    <div class="progress-header">
      <span>Journey Progress</span>
      <span id="progressText">0 / 20 Days Completed (0%)</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="totals">
      <div>Java Core/Adv: <strong>14H</strong></div>
      <div>Git & DSA: <strong>8H</strong></div>
      <div>Spring & Sec: <strong>33H</strong></div>
      <div>Buffer: <strong>5H</strong></div>
    </div>
  </div>

  <div class="today-section">
    <h2 class="section-title">✨ Today's Mission</h2>
    <div id="today-container">
      <!-- Today's tasks will be injected here -->
    </div>
  </div>

  <div>
    <h2 class="section-title">📅 All Days Overview</h2>
    <div class="days-grid" id="all-days-container">
      <!-- Grid of all days will be injected here -->
    </div>
  </div>

  <button class="reset-btn" onclick="resetTracker()">Reset All Progress</button>
</div>

<script>
// Base Data parsed from the original prompt with strict dates added
const schedule = [
  { id: 1, date: "2026-08-10", label: "Day 1", subtitle: "Aug 10", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 2, date: "2026-08-11", label: "Day 2", subtitle: "Aug 11", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 3, date: "2026-08-12", label: "Day 3", subtitle: "Aug 12", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 4, date: "2026-08-13", label: "Day 4", subtitle: "Aug 13", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 5, date: "2026-08-14", label: "Day 5", subtitle: "Aug 14", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 6, date: "2026-08-15", label: "Day 6", subtitle: "Aug 15", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 7, date: "2026-08-16", label: "Day 7", subtitle: "Aug 16", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 8, date: "2026-08-17", label: "Day 8", subtitle: "Aug 17", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1.5H"]] },
  { id: 9, date: "2026-08-18", label: "Day 9", subtitle: "Aug 18", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1H"], ["Git & DSA — Revision", "0.5H"]] },
  { id: 10, date: "2026-08-19", label: "Day 10", subtitle: "Aug 19", tasks: [["Spring", "1.5H"], ["Java Core & Advanced — Revision", "1H"], ["Git & DSA — Revision", "0.5H"]] },
  { id: 11, date: "2026-08-20", label: "Day 11", subtitle: "Aug 20", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 12, date: "2026-08-21", label: "Day 12", subtitle: "Aug 21", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 13, date: "2026-08-22", label: "Day 13", subtitle: "Aug 22", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 14, date: "2026-08-23", label: "Day 14", subtitle: "Aug 23", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 15, date: "2026-08-24", label: "Day 15", subtitle: "Aug 24", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 16, date: "2026-08-25", label: "Day 16", subtitle: "Aug 25", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 17, date: "2026-08-26", label: "Day 17", subtitle: "Aug 26", tasks: [["Spring", "2H"], ["Git & DSA — Revision", "1H"]] },
  { id: 18, date: "2026-08-27", label: "Day 18", subtitle: "Aug 27", tasks: [["Spring", "2H"], ["Review / Practice Buffer", "1H"]] },
  { id: 19, date: "2026-08-28", label: "Day 19", subtitle: "Aug 28", tasks: [["Spring", "2H"], ["Review / Practice Buffer", "1H"]] },
  { id: 20, date: "2026-08-29", label: "Day 20", subtitle: "Aug 29", tasks: [["Review / Practice Buffer", "3H"]] }
];

const todayContainer = document.getElementById('today-container');
const allDaysContainer = document.getElementById('all-days-container');

// Get current date stripping time to correctly compare days
const currentDate = new Date();
currentDate.setHours(0, 0, 0, 0);

function getDayStatus(dayDateStr, tasksCompleted) {
    const dayDate = new Date(dayDateStr + "T00:00:00");
    const isPast = dayDate < currentDate;
    const isToday = dayDate.getTime() === currentDate.getTime();
    
    if (tasksCompleted) return { class: 'achieved', text: 'Achieved' };
    if (isToday) return { class: 'today', text: 'Today' };
    if (isPast) return { class: 'missed', text: 'Missed' };
    return { class: 'pending', text: 'Pending' };
}

function renderApp() {
    todayContainer.innerHTML = '';
    allDaysContainer.innerHTML = '';
    let completedDaysCount = 0;
    let todayFound = false;

    schedule.forEach((day) => {
        // Evaluate completion from localStorage
        let allTasksCompleted = true;
        
        const tasksHTML = day.tasks.map((task, idx) => {
            const key = `tracker-v3-day${day.id}-task${idx}`;
            const isChecked = localStorage.getItem(key) === "true";
            if (!isChecked) allTasksCompleted = false;
            
            return `
                <label class="task">
                    <input type="checkbox" data-key="${key}" ${isChecked ? 'checked' : ''} onchange="toggleTask(this)">
                    <span class="${isChecked ? 'completed' : ''}">${task[0]} — <small>${task[1]}</small></span>
                </label>
            `;
        }).join('');

        if (allTasksCompleted) completedDaysCount++;

        const status = getDayStatus(day.date, allTasksCompleted);
        const dayDate = new Date(day.date + "T00:00:00");
        const isToday = dayDate.getTime() === currentDate.getTime();

        const cardHTML = `
            <div class="${isToday ? 'today-card' : 'day-card'}">
                <div class="day-header">
                    <div class="day-title">${day.label} <span style="opacity:0.5; font-size: 0.9rem; font-weight: 400; margin-left: 0.5rem">${day.subtitle}</span></div>
                    <span class="badge ${status.class}">${status.text}</span>
                </div>
                <div class="task-list">
                    ${tasksHTML}
                </div>
            </div>
        `;

        if (isToday) {
            todayContainer.innerHTML = cardHTML;
            todayFound = true;
        }

        allDaysContainer.innerHTML += cardHTML;
    });

    if (!todayFound) {
        todayContainer.innerHTML = `<div class="empty-state">No specific tasks scheduled for today. You're outside the active tracker window!</div>`;
    }

    updateProgress(completedDaysCount);
}

function toggleTask(checkbox) {
    const key = checkbox.getAttribute('data-key');
    localStorage.setItem(key, checkbox.checked);
    renderApp(); // Re-render to update statuses and cross-outs dynamically
}

function updateProgress(completedCount) {
    const totalDays = schedule.length;
    const percent = Math.round((completedCount / totalDays) * 100);
    document.getElementById("progressText").textContent = `${completedCount} / ${totalDays} Days Completed (${percent}%)`;
    document.getElementById("progressBar").style.width = percent + "%";
}

function resetTracker() {
    if (!confirm("Are you sure you want to reset all progress? This cannot be undone.")) return;
    schedule.forEach(day => {
        day.tasks.forEach((_, idx) => {
            localStorage.removeItem(`tracker-v3-day${day.id}-task${idx}`);
        });
    });
    renderApp();
}

// Initial Load
renderApp();
</script>
</body>
</html>
